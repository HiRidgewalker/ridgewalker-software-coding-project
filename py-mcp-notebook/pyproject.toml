[project]
name = "learning-mcp-notebook"
version = "0.1.0"
description = "A Chinese quickstart tutorial for learning Model Context Protocol with Python."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "mcp[cli]>=1.12.4",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
