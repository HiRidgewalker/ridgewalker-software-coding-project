syntax = "proto3";

package stage2;

message UserRequest {
  int64 user_id = 1;
  bool include_tags = 2;
}

message UserReply {
  int64 user_id = 1;
  string name = 2;
  int32 age = 3;
  bool active = 4;
  repeated string tags = 5;
}

service UserService {
  rpc GetUser (UserRequest) returns (UserReply);
}

