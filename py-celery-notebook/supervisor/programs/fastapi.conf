[program:fastapi]
directory=%(here)s/../..
command=%(here)s/../../.venv/bin/uvicorn main:app --host 127.0.0.1 --port 8000
autostart=true
autorestart=true
startsecs=5
startretries=5
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=%(here)s/../../runtime/logs/fastapi.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=5
redirect_stderr=true
environment=PYTHONUNBUFFERED="1"
