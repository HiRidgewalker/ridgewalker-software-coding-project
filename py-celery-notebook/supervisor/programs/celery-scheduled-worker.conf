[program:celery-scheduled-worker]
directory=%(here)s/../..
command=%(here)s/../../.venv/bin/celery -A app.task_queue.celery_app:celery_app worker --queues=celery.scheduled.queue --hostname=scheduled@%%h --concurrency=1 --loglevel=INFO
autostart=true
autorestart=true
startsecs=5
startretries=5
stopsignal=TERM
stopwaitsecs=120
stopasgroup=true
killasgroup=true
stdout_logfile=%(here)s/../../runtime/logs/celery-scheduled-worker.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=5
redirect_stderr=true
environment=PYTHONUNBUFFERED="1"
