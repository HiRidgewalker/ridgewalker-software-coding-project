[program:celery-async-worker]
directory=%(here)s/../..
command=%(here)s/../../.venv/bin/celery -A app.task_queue.celery_app:celery_app worker --queues=celery.async.queue --hostname=async@%%h --concurrency=2 --loglevel=INFO
autostart=true
autorestart=true
startsecs=5
startretries=5
stopsignal=TERM
stopwaitsecs=120
stopasgroup=true
killasgroup=true
stdout_logfile=%(here)s/../../runtime/logs/celery-async-worker.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=5
redirect_stderr=true
environment=PYTHONUNBUFFERED="1"
